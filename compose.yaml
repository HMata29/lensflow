services:
  postgres:
    image: postgres:18
    container_name: lensflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lensflow
      POSTGRES_USER: lensflow
      POSTGRES_PASSWORD: lensflow_dev
    ports:
      - "5432:5432"
    volumes:
      - lensflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensflow -d lensflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lensflow_postgres_data:
